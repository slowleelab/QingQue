name: Release

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: slowleelab/lumio

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lumio_pass
          POSTGRES_USER: lumio
          POSTGRES_DB: lumio
        ports: ["5432:5432"]
    env:
      REDIS_HOST: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: lumio_pass
      LUMIO_ENVIRONMENT: development
      LUMIO_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        working-directory: agent
        run: poetry install --no-interaction
      - name: Generate gRPC stubs
        working-directory: agent
        run: poetry run python scripts/generate_grpc.py
      - name: Run tests
        working-directory: agent
        run: poetry run pytest --ignore=tests/test_bot_api.py --ignore=tests/test_assist_api.py --ignore=tests/test_session_lifecycle_e2e.py --ignore=tests/test_integration.py -v --tb=short

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent/
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION#v}\]/,/^## \[/" CHANGELOG.md | head -n -1 | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Lumio / 灵智 ${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.notes.outputs.notes }}

            ## Docker

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ```

            ## 快速开始

            参见 [README](https://github.com/slowleelab/lumio#readme) — `make demo` 一键体验。
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
