name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        working-directory: agent
        run: poetry install --no-interaction
      - name: Ruff check
        working-directory: agent
        run: poetry run ruff check lumio/ tests/
      - name: Ruff format check
        working-directory: agent
        run: poetry run ruff format --check lumio/
      - name: Mypy type check (advisory)
        working-directory: agent
        # P0-4 整改: 不再 || true 静默, 改为 advisory job.
        # 报告 mypy 错误数, 但不 fail CI. 等 171 错误收敛 (P1-1b 后续) 再 fail.
        # 这样新增错误立刻可见, 历史错误不阻塞 PR.
        run: |
          set +e
          poetry run mypy lumio/ > /tmp/mypy.log 2>&1
          mypy_exit=$?
          set -e
          cat /tmp/mypy.log | tail -50
          echo ""
          echo "mypy_exit_code=${mypy_exit} (advisory: 不 fail CI)"
          errors=$(grep -c "error:" /tmp/mypy.log || true)
          echo "mypy_error_count=${errors}"

      - name: Observability loop check
        # P1-4 整改: verify-observability 入 CI, 防止 dashboard 名字错回归
        # (commit e86a962 那种 lumio_session_transitions_total → session_transitions_total 错)
        # 注意: Makefile 在仓库根, 不能设 working-directory: agent
        run: make verify-observability

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lumio_pass
          POSTGRES_USER: lumio
          POSTGRES_DB: lumio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: lumio_pass
      LUMIO_ENVIRONMENT: development
      LUMIO_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        working-directory: agent
        run: poetry install --no-interaction
      - name: Run unit tests
        working-directory: agent
        # P1-7 整改: 加 --cov + --cov-fail-under, 让 pyproject fail_under 真正生效
        # 当前实测 ~57% (test_retrieval RecursionError 拉低), 留 buffer
        # 后续 P1-6 修 RecursionError 后再提到 60
        # 第五轮修复: 删除已随 gRPC 移除的 generate_grpc.py 死步骤 (CI 必红);
        # test_integration.py 为纯 mock 测试 (无 Docker 依赖), 纳入运行
        run: |
          poetry run pytest \
            --ignore=tests/test_bot_api.py \
            --ignore=tests/test_assist_api.py \
            --ignore=tests/test_session_lifecycle_e2e.py \
            --cov=lumio --cov-report=term-missing --cov-fail-under=55 \
            -v --tb=short

  mcp-server:
    name: Java MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & verify (tests + coverage gate)
        working-directory: mcp-server
        run: mvn -B verify

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Build Docker image (context: agent/)"
        run: docker build -f deploy/Dockerfile -t lumio:${{ github.sha }} agent/
      - name: Verify image
        run: docker images lumio

  e2e-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    env:
      LUMIO_ENVIRONMENT: development
      LUMIO_RATE_LIMIT_ENABLED: "false"
      LLM_BASE_URL: http://localhost:11434/v1
      POSTGRES_PASSWORD_DOCKER: lumio_pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Start Demo stack
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
      - name: Wait for services
        working-directory: deploy
        run: |
          READY=""
          for i in $(seq 1 120); do
            if curl -s http://localhost:8000/api/health | grep -q "ok\|healthy\|degraded"; then
              echo "Bot ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ -z "$READY" ]; then
            echo "❌ Bot 120s 未就绪, 导出容器日志:"
            docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --no-color bot assist | tail -100
            exit 1
          fi
      - name: Smoke test — send message
        # 第五轮修复: chat/send 已强制认证, 先 login 拿 token 再带 Authorization
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            # login 失败时尝试 dev bypass 环境变量 (demo 默认 admin 凭据)
            TOKEN=$(LUMIO_DEV_AUTH_BYPASS=true curl -s http://localhost:8000/api/health 2>/dev/null || true)
          fi
          RESP=$(curl -s -X POST http://localhost:8000/api/chat/send \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TOKEN}" \
            -d '{"message":"信用卡年费怎么减免"}')
          echo "$RESP" | grep -q '"accepted":true'
          echo "✅ Send OK"
