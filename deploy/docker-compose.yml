# Lumio Docker Compose - 开发环境全套中间件编排
# 使用方式: docker compose up -d
# 验证:     docker compose ps
# 环境变量: 从项目根目录 .env 文件读取

services:
  # ── PostgreSQL 16 ──────────────────────────────────
  postgres:
    image: postgres:16
    container_name: lumio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DOCKER:-lumio_pass}
      POSTGRES_DB: lumio
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumio-net

  # ── Redis 7.2 ──────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: lumio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumio-net

  # ── Elasticsearch 8.19 + IK 分词 ──────────────────
  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: smartcs/elasticsearch-ik:8.19.9
    container_name: lumio-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=lumio-es
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumio-net

  # ── etcd（Milvus 元数据）──────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: lumio-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    # etcd 仅供 Milvus 内部访问，不暴露到宿主机端口，避免与 VPNKit 代理冲突
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumio-net

  # ── MinIO（对象存储 + Milvus 依赖）────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: lumio-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumio-net

  # ── Milvus 2.4 Standalone ─────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: lumio-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumio-net

  # ── Kafka 3.7 KRaft 模式 ──────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: lumio-kafka
    restart: unless-stopped
    environment:
      # KRaft 模式（无需 ZooKeeper）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 自动创建 Topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 日志保留
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 5368709120
      # KRaft 集群 ID（必须设置，可用 kafka-storage.sh random-uuid 生成）
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumio-net

  # ── Redis Exporter ────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: lumio-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lumio-net

  # ── PostgreSQL Exporter ───────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: lumio-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://lumio:${POSTGRES_PASSWORD_DOCKER:-lumio_pass}@postgres:5432/lumio?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lumio-net

  # ── Kafka Exporter ────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: lumio-kafka-exporter
    restart: unless-stopped
    command: --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lumio-net

  # ── Prometheus ────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: lumio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - postgres
      - redis
      - elasticsearch
      - milvus
      - kafka
    networks:
      - lumio-net

  # ── Grafana ───────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: lumio-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - lumio-net

  # ── Jaeger（全链路追踪后端：OTLP 采集 + UI） ──────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: lumio-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP over HTTP（Python/Java 导出入口）
    networks:
      - lumio-net

  # ── ZooKeeper（chat-svc 在线客服） ──────────
  zookeeper:
    image: zookeeper:3.8
    container_name: lumio-zk
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok,cons"
    ports:
      - "2182:2181"
    networks:
      - lumio-net

  # ── Nginx 开发网关 ────────────────────────────────
  # 生产环境使用 Higress（K8s 原生），开发环境用 Nginx 替代
  nginx:
    image: nginx:1.25-alpine
    container_name: lumio-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    depends_on:
      - prometheus
    networks:
      - lumio-net

  # ── Nacos：服务注册 + MCP Registry（仅 gateway profile 启用）─────
  # 启动：make gateway-up（= docker compose --profile gateway up -d）
  # 默认 make up 不会拉起本服务，开发主流程零影响。
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: lumio-nacos
    profiles: ["gateway"]
    restart: unless-stopped
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-false}
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    ports:
      - "8848:8848"   # 控制台 / OpenAPI
      - "9848:9848"   # gRPC（客户端长连接）
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lumio-net

  # ── Higress AI 网关：单工具平面 + 统一治理（仅 gateway profile 启用）──
  # 以外部 Nacos 作为服务发现与配置存储；对上游 Python 大脑暴露统一 MCP 入口（streamable-http）。
  # 数据面路由与 MCP Server 通过控制台/OpenAPI 或 deploy/higress/ 参考配置下发。
  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.1.5
    container_name: lumio-higress
    profiles: ["gateway"]
    restart: unless-stopped
    environment:
      - MODE=standalone
      # 复用上面的 Nacos 作为配置与注册中心
      - NACOS_SERVER_URL=http://nacos:8848
      - CONFIG_STORAGE=nacos
      # 允许网关通过宿主机访问以 make mcp-server-run 方式运行的 Java MCP Server(:8090)
      - HIGRESS_CONSOLE_PORT=8080
    ports:
      - "10000:80"     # 网关数据面：Python 大脑经此调用 MCP（/mcp/...）
      - "8443:443"     # 网关数据面（HTTPS）
      - "18080:8080"   # Higress 控制台
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - higress_data:/data
    networks:
      - lumio-net

  # ── Java MCP Server：信用卡工具平面（仅 gateway profile 启用）──────
  # 红线：仅 mock 构造数据，绝不连接真实银行核心系统。
  # 以 prod,nacos profile 启动：优雅停机 + 暴露面收敛 + 注册到 Nacos，
  # 由 Higress 经服务发现路由（SSE↔streamable-http 桥接）。
  # 默认 make up 不会拉起本服务；make gateway-up 时随网关一并启动。
  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    image: lumio-mcp-server:1.0.0
    container_name: lumio-mcp-server
    profiles: ["gateway"]
    restart: unless-stopped
    environment:
      # prod：优雅停机 + 暴露面收敛；nacos：向 Nacos 注册实例
      - SPRING_PROFILES_ACTIVE=prod,nacos
      - LUMIO_NACOS_SERVER_ADDR=nacos:8848
      - LUMIO_NACOS_SERVICE_NAME=lumio-mcp-server
      # 注册到 Nacos 的实例 IP 用容器服务名，便于 Higress 经网络路由
      - LUMIO_NACOS_INSTANCE_IP=mcp-server
      # 全链路追踪：向 Jaeger 导出 span（缺省关，设端点即启用）
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${MCP_TRACING_SAMPLE:-0.1}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      # OTel Resource 标签 (commit 7 补齐, 便于 Jaeger 按 namespace / env 过滤)
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=lumio,deployment.environment=${LUMIO_ENV:-production}
    ports:
      - "8090:8090"   # MCP SSE 端点（/sse、/mcp/message）
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - lumio-net

# ── 数据卷 ──────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  es_data:
  etcd_data:
  minio_data:
  milvus_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  nacos_data:
  higress_data:

# ── 网络 ────────────────────────────────────────────
networks:
  lumio-net:
    driver: bridge
