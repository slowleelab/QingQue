              value: "production"
            - name: REDIS_HOST
              value: "redis"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: ES_HOSTS
              value: "http://elasticsearch:9200"
            - name: MILVUS_HOST
              value: "milvus"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: LUMIO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: jwt-secret
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: llm-api-key
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: minio-secret-key
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: es-username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: es-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: redis-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lumio-assist
spec:
  selector:
    app: lumio
    service: assist
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumio-bot-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumio-bot
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumio-assist-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumio-assist
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
