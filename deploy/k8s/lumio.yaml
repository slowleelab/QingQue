apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumio-bot
  labels:
    app: lumio
    service: bot
spec:
  replicas: 2
  # 第五轮修复: LLM timeout 60s > 默认 30s, 滚动更新会截断 in-flight 请求
  terminationGracePeriodSeconds: 90
  selector:
    matchLabels:
      app: lumio
      service: bot
  template:
    metadata:
      labels:
        app: lumio
        service: bot
    spec:
      containers:
        - name: bot
          image: lumio:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE
              value: "bot"
            - name: LUMIO_ENVIRONMENT
              value: "production"
            - name: REDIS_HOST
              value: "redis"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: ES_HOSTS
              value: "http://elasticsearch:9200"
            - name: MILVUS_HOST
              value: "milvus"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: LUMIO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: jwt-secret
            # 第五轮修复: 生产凭据校验 (config._validate_production_security) 强制要求,
            # 缺失会 ValueError → crash loop
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: llm-api-key
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: minio-secret-key
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: es-username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: es-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: redis-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lumio-bot
spec:
  selector:
    app: lumio
    service: bot
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
