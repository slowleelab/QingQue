[tool.poetry]
name = "lumio"
version = "0.1.0"
description = "灵智（Lumio）— 银行信用卡智能客服平台：AI 坐席辅助 + 机器人自助问答"
authors = ["Lumio Team"]
package-mode = false
packages = [
    { include = "lumio", from = "." },
]

[tool.poetry.scripts]
lumio-bot = "lumio.main:bot_app"
lumio-assist = "lumio.main:assist_app"

[tool.poetry.dependencies]
python = "^3.11"
# Web 框架
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.31.1,<1.0"}
pydantic = "^2.0"
pydantic-settings = "^2.0"

# 数据库
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"

# 缓存
redis = {extras = ["hiredis"], version = "^5.0"}

# 全文检索
elasticsearch = {extras = ["async"], version = "^8.19"}

# 向量数据库
pymilvus = "^2.4"

# 对象存储
minio = "^7.2"

# 消息队列
aiokafka = "^0.10"

# 大模型
openai = "^1.30"

# 文档解析
pymupdf = "^1.24"
python-docx = "^1.1"
beautifulsoup4 = "^4.12"
markdown-it-py = "^3.0"
openpyxl = "^3.1"
# 重试
tenacity = "^8.2"
# YAML frontmatter
pyyaml = "^6.0"
# 同步 PostgreSQL 驱动（脚本用）
psycopg2-binary = "^2.9"

# 认证与限流
pyjwt = ">=2.8"
slowapi = ">=0.1.9"

# 可观测性
opentelemetry-api = "^1.20"
opentelemetry-sdk = "^1.20"
prometheus-client = "^0.20"
greenlet = "^3.5.0"
alembic = "^1.18.4"
python-multipart = "^0.0.27"
uuid-utils = "^0.10"
opentelemetry-exporter-otlp-proto-http = "^1.42.1"
opentelemetry-instrumentation-fastapi = "^0.63b1"
opentelemetry-instrumentation-redis = "^0.63b1"
opentelemetry-instrumentation-httpx = "^0.63b1"
pyahocorasick = ">=2.0"
mcp = "^1.28.1"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
ruff = "^0.8"
mypy = "^1.13"
pre-commit = "^4.0"
coverage = "^7.6"


[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: slow end-to-end tests that require LLM inference or external services",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["lumio", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long handled by formatter
    "RUF001", # ambiguous unicode in strings — Chinese punctuation is intentional
    "RUF002", # ambiguous unicode in docstrings — Chinese punctuation is intentional
    "RUF003", # ambiguous unicode in comments — Chinese punctuation is intentional
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends 在默认参数中调用是官方惯用法 (依赖注入)
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["lumio"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# P1-1b 整改: fire-and-forget asyncio.create_task 是项目显式模式
# (后台 worker, 不需 await 拿结果, 用完即丢). 加 noqa RUF006.
"lumio/services/**/*.py" = ["RUF006"]
"lumio/shared/audit_middleware.py" = ["RUF006"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["lumio"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
